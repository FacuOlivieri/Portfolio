<section class="section" id="contacto" aria-labelledby="t-cont">
  <header class="section__head reveal">
    <p class="eyebrow">@PostMapping("/contacto")</p>
    <h2 class="section__title" id="t-cont">Contacto</h2>
    <p class="section__lead">¿Tenés una propuesta o querés charlar? Escribime y te respondo a la brevedad.</p>
  </header>

  <div class="contact">
    <ul class="contact__info reveal">
      <li>
        <button class="info" type="button" data-copy>
          <span class="info__ico"><svg class="ico"><use href="#i-mail"/></svg></span>
          <span class="info__body"><span class="info__label">Email</span><span data-email></span></span>
          <span class="info__action"><svg class="ico"><use href="#i-copy"/></svg><span class="info__hint">Copiar</span></span>
        </button>
      </li>
      <li>
        <a class="info" href="tel:+541167832193">
          <span class="info__ico"><svg class="ico"><use href="#i-phone"/></svg></span>
          <span class="info__body"><span class="info__label">Teléfono</span>+54 11 6783-2193</span>
        </a>
      </li>
      <li>
        <a class="info" href="https://www.linkedin.com/in/facundo-nicol%C3%A1s-olivieri-6197ab233/" target="_blank" rel="noopener">
          <span class="info__ico"><svg class="ico"><use href="#i-link"/></svg></span>
          <span class="info__body"><span class="info__label">LinkedIn</span>facundo-nicolás-olivieri</span>
          <span class="info__action"><svg class="ico"><use href="#i-arrow"/></svg></span>
        </a>
      </li>
      <li>
        <div class="info">
          <span class="info__ico"><svg class="ico"><use href="#i-pin"/></svg></span>
          <span class="info__body"><span class="info__label">Ubicación</span>San Justo, Buenos Aires</span>
        </div>
      </li>
    </ul>

    <form class="form reveal" id="contact-form" novalidate>
      <div class="form__row">
        <div class="field">
          <input id="f-nombre" name="nombre" type="text" placeholder=" " autocomplete="name" required minlength="2">
          <label for="f-nombre">Nombre</label>
          <span class="field__error" data-for="f-nombre"></span>
        </div>
        <div class="field">
          <input id="f-email" name="email" type="email" placeholder=" " autocomplete="email" required>
          <label for="f-email">Email</label>
          <span class="field__error" data-for="f-email"></span>
        </div>
      </div>
      <div class="field">
        <input id="f-asunto" name="asunto" type="text" placeholder=" " required minlength="3">
        <label for="f-asunto">Asunto</label>
        <span class="field__error" data-for="f-asunto"></span>
      </div>
      <div class="field">
        <textarea id="f-mensaje" name="mensaje" rows="6" placeholder=" " required maxlength="1000"></textarea>
        <label for="f-mensaje">Mensaje</label>
        <span class="field__count" id="f-count">0 / 1000</span>
        <span class="field__error" data-for="f-mensaje"></span>
      </div>
      <div class="form__foot">
        <button class="btn btn--primary btn--send" type="submit" id="f-submit">
          <span>Enviar mensaje</span><svg class="ico"><use href="#i-send"/></svg>
        </button>
        <p class="form__status" id="f-status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </div>
</section>
